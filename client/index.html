<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <meta
      name="description"
      content="Log trades, upload screenshots, track emotions, analyze performance, and discover your trading edge with JAHZJOURNALS."
    />
    <title>JAHZJOURNALS - Forex Trading Journal & Analytics Platform</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("jahzjournals-theme");
          const oldSettings = localStorage.getItem("user_settings");
          let theme = savedTheme;
          if (!theme && oldSettings) {
            theme = JSON.parse(oldSettings)?.appearance?.theme;
          }
          theme = theme || "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (theme === "dark" || (theme === "system" && prefersDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.add("light");
          }
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script>
      // Google Consent Mode v2 — default consent state
      // Must execute before any Google advertising/analytics scripts
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'analytics_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
    </script>
  </head>
